server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 与后端 MAX_UPLOAD_SIZE_MB 对齐
    client_max_body_size 200m;

    # 统一反代头。身份头（x-user-*）只能由 APISIX 注入，
    # 这里显式清空浏览器传来的值，避免绕过网关伪造 admin。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-user-id "";
    proxy_set_header x-user-num "";
    proxy_set_header x-user-roles "";
    proxy_set_header x-user-role-ids "";

    location = / {
        return 302 /enterprise/;
    }

    location = /enterprise {
        return 301 /enterprise/;
    }

    # SPA 静态资源与前端路由回退
    location /enterprise/ {
        try_files $uri $uri/ /enterprise/index.html;
    }

    # /enterprise/api/v1/agents -> api:7550/api/v1/agents
    location /enterprise/api/ {
        proxy_pass http://api:7550/api/;
        proxy_read_timeout 60s;
    }

    # /enterprise/health/ready -> api:7550/health/ready
    location /enterprise/health/ {
        proxy_pass http://api:7550/health/;
        access_log off;
    }
}

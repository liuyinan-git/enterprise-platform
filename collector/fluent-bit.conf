# ============================================================================
# Fluent Bit 配置 —— Docker 日志 → Wazuh(syslog) + 企业日志平台(HTTP) 双发
#
# 基于现有生产配置整理：保留 Wazuh 输出，追加平台输出，并清理冗余 filter。
#
# 需设置的环境变量（docker-compose environment 或启动脚本 export）：
#   WAZUH_HOST / WAZUH_PORT          Wazuh 服务地址与端口
#   LOG_PLATFORM_HOST / PORT        平台后端地址与端口（本地 7553 / Docker 7552）
#   LOG_PLATFORM_API_KEY            平台采集端密钥（= 企业日志平台后端 .env 的 COLLECTOR_API_KEY）
#   LOG_PLATFORM_SOURCE_ID          采集端标识，多机部署每台写不同值，如 docker-01
#   HOSTNAME                        真实主机名（平台用其作 device_id，见下方 filter 说明）
# ============================================================================

[SERVICE]
    Flush                           5
    Daemon                          Off
    Log_Level                       info

    Parsers_File                    parsers.conf

    HTTP_Server                     On
    HTTP_Listen                     0.0.0.0
    HTTP_PORT                       2020

    storage.path                    /fluent-bit/log/storage
    storage.sync                    normal
    storage.checksum                off

    storage.backlog.mem_limit       64MB
    storage.total_limit_size        5G

    storage.metrics                 on
    storage.backlog.flush_on_shutdown on
    storage.max_chunks_up           128

#########################################################
# INPUT：接收 Docker fluentd logging driver 日志
#########################################################

[INPUT]
    Name                            forward
    Listen                          0.0.0.0
    Port                            24224
    threaded                        true

#########################################################
# FILTER：只采集打了 label 的容器
# 注意：需在 docker 端配置 log-opts labels=log.collect，
#       否则此 filter 会把所有日志全部丢弃。
#########################################################

# [FILTER]
#     Name                            grep
#     Match                           *
#     Regex                           labels.log.collect ^true$

#########################################################
# FILTER：补真实主机名（平台用 hostname 作为 device_id）
# 重要：若 fluent-bit 跑在容器里，${HOSTNAME} 是容器自身 hostname（随机 id），
#       需在 docker-compose 给本服务显式设置 hostname: <真实主机名>。
# 说明：原配置有两个重复的 record_modifier（Match * 与 Match docker.*），
#       因 Match * 已覆盖全部，已合并为一个。
# 说明：原配置的 modify/Remove stream 过滤器已移除，保留 stream 字段
#       （用于区分 stdout/stderr，平台侧有价值；Wazuh 输出不受影响）。
#########################################################

[FILTER]
    Name                            record_modifier
    Match                           *
    Record                          hostname ${HOSTNAME}

#########################################################
# FILTER：补结构化字段 source_ip / username（可选，按需启用）
#
# 平台标准化时会从 record 里读这些键（见后端 app/parsers/json_parser.py）：
#   source_ip / dest_ip / source_port / dest_port / username / process_name
# 只要 Fluent Bit 发出去的 record 带这些键，就会被识别并写入「日志检索」页。
#
# 两种补法（二选一或组合）：
# 1) 静态值——来源 IP = 本机 IP，多机部署每台写自己的 IP，用 record_modifier：
#      [FILTER]
#          Name    record_modifier
#          Match   *
#          Record  source_ip ${LOG_PLATFORM_SOURCE_IP}
#    并在环境变量里加 LOG_PLATFORM_SOURCE_IP=192.168.1.10
#
# 2) 动态值——每条日志不同，需应用输出结构化 JSON，或加 Lua/parser 从正文提取。
#    例如应用日志打成 {"message":"...","username":"zhangsan","source_ip":"10.10.1.25"}，
#    Fluent Bit 原样透传这些键即可被平台识别。
#    注意：username 无法从普通 stdout 文本凭空得到，必须由应用侧提供。
#########################################################

#########################################################
# OUTPUT 1：推送到 Wazuh（syslog）
#########################################################

[OUTPUT]
    Name                            syslog
    Match                           *
    Host                            ${WAZUH_HOST}
    Port                            ${WAZUH_PORT}
    Mode                            tcp
    Syslog_Format                   rfc5424
    Syslog_Hostname_Key             hostname
    Syslog_Appname_Key              container_name
    Syslog_Message_Key              log
    tls                             off
    Retry_Limit                     False
    net.keepalive                   on
    storage.total_limit_size        2G

#########################################################
# OUTPUT 2：推送到「企业全域日志管控与智能告警平台」
#########################################################

[OUTPUT]
    Name                            http
    Match                           *
    Host                            ${LOG_PLATFORM_HOST}
    Port                            ${LOG_PLATFORM_PORT}
    URI                             /api/v1/ingest/fluentbit
    Format                          json_lines
    header                          X-API-Key   ${LOG_PLATFORM_API_KEY}
    header                          X-Source-Id ${LOG_PLATFORM_SOURCE_ID}
    tls                             Off
    Retry_Limit                     False

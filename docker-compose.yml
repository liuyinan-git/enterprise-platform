# 编排：mysql + redis + docker-proxy + api + worker + scheduler + frontend。
# frontend 镜像内自带 nginx：静态资源 + /enterprise/api 反向代理；ollama 在后续阶段启用。
# docker.sock 仅由 docker-proxy 挂载；api / worker / scheduler 都不挂。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enterprise_platform}
      MYSQL_USER: ${MYSQL_USER:-log_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ROOT_PASSWORD}
    ports:
      # 只绑 127.0.0.1：供本地 uvicorn --reload 直连（backend/.env 的 MYSQL_HOST=localhost）。
      # 不暴露到局域网；容器之间仍走服务名 mysql。端口被占用时用 MYSQL_HOST_PORT 覆盖。
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend_net

  # 唯一挂载 docker.sock 的服务。api / worker / scheduler 都不挂，只经 backend_net 访问它。
  # 代理自身没有鉴权，因此**不发布宿主机端口**，只在 backend_net 内以 docker-proxy:2375 可达。
  # 注意：docker.sock 挂成 :ro 并不能阻止 API 写操作（socket 是套接字，不是普通文件），
  # 真正的隔离来自下面这份白名单。
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2   # 固定版本，别用 :latest（注意 tag 带 v 前缀）
    restart: unless-stopped
    environment:
      # 只开「容器」这一个 section 的读 + 启停；其余 section（IMAGES / EXEC / VOLUMES /
      # NETWORKS / BUILD / SECRETS ...）一律保持默认的 0（拒绝）。
      # 该镜像所有开关默认都是 0，即默认全拒。
      CONTAINERS: "1"       # 容器列表 / 详情 / 日志
      POST: "1"             # 非 GET 方法的总开关；不开则 start/stop/restart 一律 403
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      # 该开关同时放行 kill（代理无法只放行 restart），所以代理绝不能暴露到 backend_net 之外
      ALLOW_RESTARTS: "1"
      LOG_LEVEL: "warning"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend_net

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-7550}:${APP_PORT:-7550}"
    volumes:
      # 源码挂载：改后端代码后 `docker compose restart api` 即生效，无需 --build。
      # 只挂代码 / 迁移 / 附件目录，不挂整个 backend——避免宿主机的 backend/.env
      # 被 pydantic-settings 当成 dotenv 读取，覆盖 compose 注入的环境变量。
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      docker-proxy:
        condition: service_started
    networks:
      - backend_net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # 浏览器统一入口：/enterprise/ 静态页 + /enterprise/api 反代。
      # 接入 APISIX 后应只让网关访问此端口，不要直接对客户端暴露。
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - backend_net

  worker:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -c
      - celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      docker-proxy:
        condition: service_started
    networks:
      - backend_net

  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -c
      - celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend_net

volumes:
  mysql_data:
  redis_data:

networks:
  backend_net:
    driver: bridge
